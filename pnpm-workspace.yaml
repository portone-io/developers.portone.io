  esbuild@<=0.24.2: ">=0.25.0"
  fflate@>=0.7.0 <0.7.5: ^0.7.5
  fast-xml-parser@>=4.3.6 <=5.3.3: ^5.3.4
  flatted@<3.4.2: ^3.4.2
  glob@>=9.0.0 <14.0.2: ^14.0.2
