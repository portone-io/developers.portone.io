  mdast-util-to-string: ^4.0.0
  remark-frontmatter: ^5.0.0
  remark-gfm: ^4.0.1
  remark-mdx: ^3.1.1
  remark-parse: ^11.0.0
  remark-stringify: ^11.0.0
  string-width: ^9.0.0
  ts-pattern: ^5.9.2
  unified: ^11.0.5
  unified-lint-rule: ^3.0.1
  unist-util-visit: ^5.2.0
  vite: ^8.3.8
